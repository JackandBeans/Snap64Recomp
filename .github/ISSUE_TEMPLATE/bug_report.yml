name: Bug report
description: Something the port does wrong, or differently from the console
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. The files asked for below are what make a report answerable;
        `snap64.log` is written next to the executable on every run (on Linux, in the
        data directory the log's first line names).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what the console (or an earlier build) does instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reach it
      description: Course, place, what you were doing. A screenshot or a short clip helps for anything visual.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port version
      description: From the window title, or Properties > Details on Snap64Recomp.exe.
      placeholder: 1.0.8
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Windows 11
        - Windows 10
        - Steam Deck, the native Linux build
        - Steam Deck, the Windows build through Proton
        - Linux desktop, the native build
        - Linux desktop, the Windows build through Wine or Proton
        - Something else (say what below)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      description: GPU model and driver version; on a Deck, which model and which SteamOS.
      placeholder: GeForce RTX 3060, driver 566.03
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: |
        Attach `snap64.log` and `snapsettings.json` from the executable's folder (drag them here).
        If the log has `[SNAP-AV]` lines, attach `Snap64Recomp.map` too. Never attach your ROM.
  - type: checkboxes
    id: rom
    attributes:
      label: ROM
      options:
        - label: I am using my own dump of the US cartridge, and the port accepted it at start-up.
          required: true
