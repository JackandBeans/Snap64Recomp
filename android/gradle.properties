# Gradle settings of the Android app (android/README in BUILDING.md, step 16).
org.gradle.jvmargs=-Xmx1536m
# AndroidX is not used: SDL's activity and the port's two classes are plain
# android.app ones.
android.useAndroidX=false
# The Android Gradle plugin SDL's project ships with (8.1.1) knows compile SDK
# 34; the app targets 35, which it builds with this line.
android.suppressUnsupportedCompileSdk=35
