[patches]
# RSP microcode (RSP instructions, not CPU). aspMain -> RSPRecomp/librecomp;
# graphics ucode -> RT64. *TextEnd names alias next blob's start.
ignored = [
    "aspMainTextStart",
    "aspMainTextEnd",
    "gspF3DEX2_NoN_fifoTextStart",
    "gspF3DEX2_NoN_fifoTextEnd",
]


# auThreadMain inlines two reads of AI_LEN (0xA4500004). After recompilation,
# tools/hook_funcs.py replaces BOTH loads with snap_audio_remaining_bytes(),
# querying the host audio queue at consumption time. No scratch RDRAM address
# is used: a previous reader at 0x80700004 outlived its mailbox migration and
# caused a steadily growing audio delay. Always run hook_funcs.py after N64Recomp.
