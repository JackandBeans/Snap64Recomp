# Pokemon Snap (USA) -- N64Recomp configuration (all-relocatable strategy)
#
# entrypoint 0x80000400 (CIC-6103: header 0x80100400 minus 0x100000).
# ELF relinked with --emit-relocs so every section keeps its relocations.
#
# Overlay strategy: ALL 32 code sections are listed as relocatable. Rationale:
#  - Snap's level/menu overlays share VMAs; static mode dedupes functions by
#    address and silently drops ~16k of 20k functions. Relocatable sections
#    are keyed (section, offset), so everything is emitted.
#  - The ELF frontend only loads .rel* for listed sections, and static jals
#    into overlays (scene manager -> every level) resolve via those relocs.

# Paths: N64Recomp resolves every path in this file against the directory the
# file lives in (src/config.cpp: basedir = config path's parent, joined with
# each entry), so these are relative to the port root and the tool can be run
# from anywhere. The two inputs are not tracked; put them here under these
# names before running (see BUILDING.md):
#   pokemonsnap.relocs.elf  the decomp's ELF relinked with --emit-relocs,
#                           from a tree whose build matches the ROM
#   pokemonsnap.z64         the ROM the decomp was built against
# The ELF's file name is kept: N64Recomp stamps its stem into
# RecompiledFuncs/lookup.cpp (get_rom_name), so renaming it changes output.
[input]
entrypoint = 0x80000400
elf_path = "pokemonsnap.relocs.elf"
rom_file_path = "pokemonsnap.z64"
output_func_path = "RecompiledFuncs"
relocatable_sections_path = "overlays.us.txt"
bss_section_suffix = "_bss"
single_file_output = false
use_mdebug = false

# Symbol-less callback functions discovered by prologue scan
# (static functions splat missed; reachable only via function pointers).
manual_funcs = [
    { name = "manualfunc_8001FE88", section = ".main", vram = 0x8001FE88, size = 0xB8 },
    { name = "manualfunc_8001FF40", section = ".main", vram = 0x8001FF40, size = 0x98 },
